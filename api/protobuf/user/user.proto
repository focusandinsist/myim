syntax = "proto3";

package protobuf;

option go_package = "./api/protobuf/user;user";

message ReqUserRegister {
    string user_name = 1; // 用户名
    string password = 2; // 密码
}

message ResUserRegister {
    int32 error_code = 1; // 错误码，0表示成功
    string error_msg = 2; // 错误信息
    string user_id = 3; // 用户ID
}

message ReqUserLogin {
    string user_name = 1; // 用户名
    string password = 2; // 密码
}

message ResUserLogin {
    int32 error_code = 1; // 错误码，0表示成功
    string error_msg = 2; // 错误信息
    string user_id = 3; // 用户ID
    string access_token = 4; // JWT访问令牌
    int64 expires_at = 5; // 令牌过期时间，Unix秒
}

message ReqUserProfile {
}

message ResUserProfile {
    int32 error_code = 1; // 错误码，0表示成功
    string error_msg = 2; // 错误信息
    string user_id = 3; // 用户ID
    string user_name = 4; // 登录用户名
    string phone = 5; // 手机号
    string email = 6; // 邮箱
    string nickname = 7; // 社交昵称
    string avatar = 8; // 头像地址
    string bio = 9; // 个人简介
    int32 gender = 10; // 性别：0未知，1男，2女，3其他
    int64 birthday = 11; // 生日，Unix秒
    string region = 12; // 地区
    int32 status = 13; // 状态：0正常，1禁用，2注销
    int64 register_time = 14; // 注册时间，Unix秒
    int64 last_login_time = 15; // 最后登录时间，Unix秒
    int64 updated_time = 16; // 最后更新时间，Unix秒
}

message ReqOtherUserProfile {
    string user_id = 1; // 目标用户ID
}

message ResOtherUserProfile {
    int32 error_code = 1; // 错误码，0表示成功
    string error_msg = 2; // 错误信息
    string user_id = 3; // 用户ID
    string nickname = 4; // 社交昵称
    string avatar = 5; // 头像地址
    string bio = 6; // 个人简介
    int32 gender = 7; // 性别：0未知，1男，2女，3其他
    int64 birthday = 8; // 生日，Unix秒
    string region = 9; // 地区
}
