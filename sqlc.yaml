        out: "db/social"
        sql_package: "database/sql"
        emit_json_tags: true
  - engine: "postgresql"
    schema: "db/content/schema.sql"
    queries: "db/content/query.sql"
    gen:
      go:
        package: "contentdb"
        out: "db/content"
        sql_package: "database/sql"
        emit_json_tags: true
